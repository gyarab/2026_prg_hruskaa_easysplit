{% extends "base.html" %}

{% block title %}Nová skupina – EasySplit{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="h4 mb-4">Nová skupina</h2>
                <form method="post">
                    {% csrf_token %}
                    {% include "includes/form.html" %}
                    <button type="submit" class="btn btn-primary">Vytvořit skupinu</button>
                    <a href="{% url 'group_list' %}" class="btn btn-link">Zrušit</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
